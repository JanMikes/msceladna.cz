# Web — lint + test, then build the Next.js image and deploy it to lily via the
# shared reusable workflow (TheDevs-cz/ci). Replaces the old build + root-SSH
# deploy to spare.srv.
#
# PUBLIC_UPLOADS_URL is a BUILD arg on purpose: next.config.ts bakes its host into
# images.remotePatterns — keep it in sync with compose (static.msceladna.cz).
#
# ONE HOOK, THREE WORKFLOWS (web / strapi / nginx) all trigger app `msceladna`;
# its deploy.sh rolls all three. See lily.srv D68.

name: Web

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - 'main'
        paths:
            - 'web/**'
            - '.github/workflows/web.yml'
    pull_request:
        paths:
            - 'web/**'
            - '.github/workflows/web.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '22'
                    cache: 'npm'
                    cache-dependency-path: web/package-lock.json

            -   name: Install dependencies
                run: npm ci
                working-directory: web

            -   name: Run lint
                run: npm run lint
                working-directory: web

    test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '22'
                    cache: 'npm'
                    cache-dependency-path: web/package-lock.json

            -   name: Install dependencies
                run: npm ci
                working-directory: web

            -   name: Run tests
                run: npm test
                working-directory: web

    ship:
        needs:
            - lint
            - test
        if: github.event_name == 'push'
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: msceladna
            image: ghcr.io/janmikes/msceladna-web
            context: ./web
            build_args: |
                PUBLIC_UPLOADS_URL=https://static.msceladna.cz
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
