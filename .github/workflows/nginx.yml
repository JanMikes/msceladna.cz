# Nginx — build the static-uploads nginx image and deploy it to lily via the shared reusable
# workflow (TheDevs-cz/ci). Replaces the old build + root-SSH deploy to spare.srv.
#
# ONE HOOK, THREE WORKFLOWS: see web.yml. See lily.srv D68.

name: Nginx

on:
    push:
        branches:
            - 'main'
        paths:
            - 'nginx/**'
            - '.github/workflows/nginx.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: msceladna
            image: ghcr.io/janmikes/msceladna-nginx
            context: ./nginx
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
